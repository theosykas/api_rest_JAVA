services:
  db-auth:
    image: postgres:17-alpine
    container_name: pg-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  db-org:
    image: postgres:17-alpine
    container_name: pg-org
    environment:
      POSTGRES_DB: orgdb
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata-org:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d orgdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  auth:
    build: ./auth
    container_name: auth
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-auth:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db-auth:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  organisation:
    build: ./organisation
    container_name: organisation
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-org:5432/orgdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db-org:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

volumes:
  pgdata-auth:
  pgdata-org:

networks:
  backend:
    driver: bridge